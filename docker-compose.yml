services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: totp
      POSTGRES_PASSWORD: totp
      POSTGRES_DB: totp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totp"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      DATABASE_URL: "postgres://totp:totp@postgres:5432/totp?sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL: "720h"
      TOTP_ISSUER: "TOTP-Auth-System"
      TRUST_DEVICE_TTL: "720h"
      BCRYPT_COST: "12"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
